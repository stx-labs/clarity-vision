# Build clarity-vision.pdf and publish it, with the HTML it is printed from, to
# GitHub Pages.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PDF
        run: make pdf CHROME=google-chrome
      - name: Assemble site
        run: |
          mkdir -p _site
          cp clarity-vision.pdf _site/
          cp .build/clarity-vision.html _site/index.html
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}clarity-vision.pdf
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
